services:
  api:
    build:
      context: ./backend/LighWeight
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__defaultConnection=Host=db;Port=5432;Username=postgres;Database=lightweight;Password=postgres
      - Cors__AllowedOrigins__0=http://localhost:4200
      - Smtp__Host=mailpit
      - Smtp__Port=1025
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lightweight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    
  front:
    build:
      context: ./frontend/LightWeight
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api


volumes:
  postgres-data:
