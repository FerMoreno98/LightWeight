server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The production build calls /api on its own domain. In production Caddy sends /api to the API
    # before it gets here; this is for docker-compose.yaml (local), where nginx is the entry point.
    # Docker's DNS and a variable: nginx resolves "api" per request, so it starts even without it
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html says which JS to load: the browser keeps it but asks every time if it changed
    # (a 304 when it did not), so a new deploy is seen on the next load.
    # The deep links (/training, /profile...) also end here through try_files
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The build puts a hash in the name of the JS and CSS (outputHashing: all): a new version
    # is a new file, so these never have to be asked for again
    # In quotes: nginx reads the braces of {8} as a block otherwise
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
