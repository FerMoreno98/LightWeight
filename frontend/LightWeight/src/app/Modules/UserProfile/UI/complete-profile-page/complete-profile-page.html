<main class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="card w-full max-w-md p-8 shadow-lg shadow-black/30">
    <p class="eyebrow mb-2">Primer acceso</p>
    <h1 class="font-display mb-2 text-4xl leading-none font-bold text-fg uppercase">Completa tu perfil</h1>
    <p class="mb-6 text-sm text-muted">Solo te lo pedimos una vez. Podrás cambiarlo cuando quieras desde tu perfil.</p>

    <app-profile-form
      submitLabel="Empezar"
      busyLabel="Guardando..."
      [busy]="store.isSaving()"
      [error]="store.error()"
      (save)="onSave($event)"
    />
  </div>
</main>
