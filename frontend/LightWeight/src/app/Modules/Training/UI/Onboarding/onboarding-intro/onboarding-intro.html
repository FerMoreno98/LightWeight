<main class="mx-auto w-full max-w-6xl px-4 py-8">
  <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wider text-muted">Antes de empezar</p>
      <h1 class="mt-1 font-display text-4xl font-bold uppercase leading-none text-fg">
        Cómo se monta tu <span class="text-accent">entrenamiento</span>
      </h1>
    </div>
    @if (status() && !isTraining()) {
      <a [routerLink]="wizardUrl" class="text-sm font-medium text-muted transition hover:text-fg">Saltar la explicación →</a>
    }
  </header>

  <app-training-map [ctaLabel]="ctaLabel()" (start)="start()" />
</main>
