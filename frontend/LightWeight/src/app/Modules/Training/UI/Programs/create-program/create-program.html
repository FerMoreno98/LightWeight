<div class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-xl bg-surface border border-line p-8 shadow-xl">
    <h1 class="font-display uppercase leading-none text-center text-3xl font-bold text-fg">Nuevo programa</h1>
    <p class="mt-1 mb-6 text-center text-sm text-muted">Agrupa tus plantillas de entrenamiento bajo un mismo objetivo.</p>

    @if (error()) {
      <div class="mb-4 rounded-lg bg-danger/10 border border-danger/30 p-3 text-sm text-danger">{{ error() }}</div>
    }

    <form #programForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-soft">Nombre</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          maxlength="200"
          placeholder="Ej. Hipertrofia otoño"
          class="input mt-1"
        />
      </div>

      <div>
        <label for="periodization" class="block text-sm font-medium text-soft">Periodización</label>
        <select
          id="periodization"
          [(ngModel)]="periodization"
          name="periodization"
          required
          class="input mt-1"
        >
          <option value="" disabled selected>Selecciona una periodización</option>
          <option value="Linear">Lineal (Linear)</option>
          <option value="Ondulating">Ondulante (Ondulating)</option>
          <option value="block">Bloques (Block)</option>
          <option value="MikeIsraetel">Mike Israetel</option>
        </select>
      </div>

      <div>
        <p class="block text-sm font-medium text-soft">Grupos musculares prioritarios <span class="text-subtle">(opcional)</span></p>
        <div class="mt-2 flex flex-wrap gap-2">
          @for (group of muscleGroups; track group) {
            <button
              type="button"
              (click)="toggleMuscleGroup(group)"
              [attr.aria-pressed]="isMuscleGroupSelected(group)"
              [class]="isMuscleGroupSelected(group)
                ? 'border-accent bg-accent/10 text-accent'
                : 'border-line-strong bg-canvas text-soft hover:border-accent/60'"
              class="rounded-full border px-3 py-1 text-xs transition"
            >
              {{ muscleGroupLabel(group) }}
            </button>
          }
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button
          type="button"
          (click)="cancel()"
          class="btn btn-secondary flex-1"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="isLoading() || programForm.invalid"
          class="btn btn-primary flex-1"
        >
          {{ isLoading() ? 'Creando...' : 'Crear programa' }}
        </button>
      </div>
    </form>
  </div>
</div>
