<div class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-2xl bg-slate-800 border border-slate-700 p-8 shadow-xl">
    <h1 class="text-center text-2xl font-bold text-white">Nuevo programa</h1>
    <p class="mt-1 mb-6 text-center text-sm text-slate-400">Agrupa tus plantillas de entrenamiento bajo un mismo objetivo.</p>

    @if (error()) {
      <div class="mb-4 rounded-lg bg-red-950/50 border border-red-900 p-3 text-sm text-red-400">{{ error() }}</div>
    }

    <form #programForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-slate-300">Nombre</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          maxlength="200"
          placeholder="Ej. Hipertrofia otoño"
          class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20"
        />
      </div>

      <div>
        <label for="periodization" class="block text-sm font-medium text-slate-300">Periodización</label>
        <select
          id="periodization"
          [(ngModel)]="periodization"
          name="periodization"
          required
          class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20"
        >
          <option value="" disabled selected>Selecciona una periodización</option>
          <option value="Linear">Lineal (Linear)</option>
          <option value="Ondulating">Ondulante (Ondulating)</option>
          <option value="block">Bloques (Block)</option>
          <option value="MikeIsraetel">Mike Israetel</option>
        </select>
      </div>

      <div>
        <p class="block text-sm font-medium text-slate-300">Grupos musculares prioritarios <span class="text-slate-500">(opcional)</span></p>
        <div class="mt-2 flex flex-wrap gap-2">
          @for (group of muscleGroups; track group) {
            <button
              type="button"
              (click)="toggleMuscleGroup(group)"
              [attr.aria-pressed]="isMuscleGroupSelected(group)"
              [class]="isMuscleGroupSelected(group)
                ? 'border-emerald-400 bg-emerald-950/60 text-emerald-300'
                : 'border-slate-600 bg-slate-900 text-slate-300 hover:border-emerald-400/60'"
              class="rounded-full border px-3 py-1 text-xs transition"
            >
              {{ muscleGroupLabel(group) }}
            </button>
          }
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button
          type="button"
          (click)="cancel()"
          class="flex-1 rounded-lg border border-slate-600 px-4 py-2 text-sm text-white transition hover:bg-slate-700"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="isLoading() || programForm.invalid"
          class="flex-1 rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-900 transition hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ isLoading() ? 'Creando...' : 'Crear programa' }}
        </button>
      </div>
    </form>
  </div>
</div>
