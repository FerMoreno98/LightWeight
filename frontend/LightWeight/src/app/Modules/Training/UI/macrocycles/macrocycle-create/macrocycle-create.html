<div class="flex min-h-screen items-center justify-center px-4 py-10 text-fg">

  @if (loaded() && activeMacrocycle(); as active) {
    <div class="w-full max-w-lg rounded-xl border border-line bg-surface p-8 text-center shadow-xl">
      <h1 class="font-display uppercase leading-none text-3xl font-bold">Ya tienes un macrociclo en curso</h1>
      <p class="mt-2 text-sm text-muted">Finalízalo para poder empezar uno nuevo.</p>
      <div class="mt-6 flex flex-col gap-3 sm:flex-row">
        <button type="button" (click)="cancel()"
                class="btn btn-secondary flex-1">
          Volver
        </button>
        <a [routerLink]="['/training/macrocycle', active.id]"
           class="btn btn-primary flex-1">
          Ir al macrociclo activo
        </a>
      </div>
    </div>
  } @else {
    <form #form="ngForm" (ngSubmit)="onSubmit()"
          class="w-full max-w-lg bg-surface border border-line rounded-xl p-8 shadow-xl flex flex-col gap-6">

      <div>
        <h1 class="font-display uppercase leading-none text-4xl font-bold">Crear Macrociclo</h1>
        <p class="mt-1 text-sm text-muted">Empieza hoy un nuevo bloque de entrenamiento. Lo finalizarás cuando acabe.</p>
      </div>

      <div class="flex flex-col gap-2">
        <label for="stage" class="text-sm font-medium text-soft">Fase de entrenamiento</label>
        <select id="stage" name="stage" required [(ngModel)]="stage"
                class="input">
          <option value="" disabled>Selecciona una fase</option>
          <option value="Bulk">Volumen (Bulk)</option>
          <option value="Cut">Definicion (Cut)</option>
          <option value="Maintenance">Mantenimiento (Maintenance)</option>
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <label for="comments" class="text-sm font-medium text-soft">Comentarios <span class="text-subtle">(opcional)</span></label>
        <textarea id="comments" name="comments" rows="4" [(ngModel)]="comments"
                  placeholder="Observaciones, prioridades, restricciones..."
                  class="input resize-none py-2"></textarea>
      </div>

      @if (error()) {
        <p class="text-sm text-danger">{{ error() }}</p>
      }

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button type="button" (click)="cancel()"
                class="btn btn-secondary flex-1">
          Cancelar
        </button>
        <button type="submit" [disabled]="!form.valid || isLoading() || !loaded()"
                class="btn btn-primary flex-1">
          {{ isLoading() ? 'Creando...' : 'Crear macrociclo' }}
        </button>
      </div>
    </form>
  }
</div>
