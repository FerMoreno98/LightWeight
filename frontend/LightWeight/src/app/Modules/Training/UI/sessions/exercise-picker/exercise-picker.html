@if (open()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:px-4">
    <div class="backdrop-fade absolute inset-0 bg-black/60 backdrop-blur-sm" (click)="cancelled.emit()"></div>

    <div
      class="dialog-pop relative flex max-h-[85vh] w-full max-w-md flex-col rounded-t-2xl border border-slate-700 bg-slate-800 shadow-2xl shadow-black/40 sm:rounded-2xl"
      role="dialog"
      aria-modal="true"
      aria-labelledby="exercise-picker-title"
    >
      <div class="border-b border-slate-700 p-5">
        <div class="flex items-center justify-between gap-3">
          <h2 id="exercise-picker-title" class="text-lg font-semibold text-white">{{ title() }}</h2>
          <button
            type="button"
            (click)="cancelled.emit()"
            class="flex h-8 w-8 items-center justify-center rounded-full text-slate-400 transition hover:bg-slate-700 hover:text-white"
            aria-label="Cerrar"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <input
          type="search"
          [value]="search()"
          (input)="onSearch($event)"
          placeholder="Buscar ejercicio..."
          autofocus
          class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white placeholder:text-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
      </div>

      <ul class="flex-1 overflow-y-auto p-2">
        @for (exercise of filtered(); track exercise.id) {
          <li>
            <button
              type="button"
              (click)="picked.emit(exercise)"
              class="w-full rounded-lg px-3 py-2.5 text-left text-sm text-slate-200 transition hover:bg-slate-700 hover:text-white"
            >
              {{ exercise.name }}
            </button>
          </li>
        } @empty {
          <li class="px-3 py-8 text-center text-sm text-slate-500">No hay ejercicios que coincidan</li>
        }
      </ul>
    </div>
  </div>
}
