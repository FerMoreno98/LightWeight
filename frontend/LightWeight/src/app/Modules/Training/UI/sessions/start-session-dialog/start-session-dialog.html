@if (open()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center sm:px-4">
    <div class="backdrop-fade absolute inset-0 bg-black/60 backdrop-blur-sm" (click)="cancel()"></div>

    <form
      (ngSubmit)="confirm()"
      class="dialog-pop relative max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-t-2xl border border-line bg-surface p-6 shadow-2xl shadow-black/40 sm:rounded-xl"
      role="dialog"
      aria-modal="true"
      aria-labelledby="start-session-title"
    >
      <h2 id="start-session-title" class="text-lg font-semibold text-fg">Iniciar entrenamiento</h2>
      <p class="mt-1 text-sm text-muted">{{ sessionName() }} · ¿Cómo llegas hoy?</p>

      <div class="mt-6 flex flex-col gap-5">
        @for (field of fields; track field.key) {
          <fieldset>
            <div class="flex items-baseline justify-between gap-2">
              <legend class="text-sm font-medium text-fg">{{ field.label }}</legend>
              <span class="text-xs text-subtle">{{ field.hint }}</span>
            </div>
            <div class="mt-2 grid grid-cols-10 gap-1">
              @for (level of levels; track level) {
                <button
                  type="button"
                  (click)="select(field.key, level)"
                  [attr.aria-pressed]="values()[field.key] === level"
                  class="h-9 rounded-lg border text-sm font-semibold transition"
                  [class]="values()[field.key] === level
                    ? 'border-accent bg-accent text-accent-ink'
                    : 'border-line bg-canvas text-soft hover:border-line-strong'"
                >
                  {{ level }}
                </button>
              }
            </div>
          </fieldset>
        }

        <label class="block">
          <span class="text-sm font-medium text-fg">Comentarios <span class="font-normal text-subtle">(opcional)</span></span>
          <textarea
            [(ngModel)]="comments"
            name="comments"
            rows="3"
            maxlength="1000"
            placeholder="Molestias, cómo te encuentras, cambios de gimnasio..."
            class="mt-2 w-full rounded-lg border border-line bg-canvas px-3 py-2 text-sm text-fg placeholder:text-subtle focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
          ></textarea>
        </label>
      </div>

      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button
          type="button"
          (click)="cancel()"
          [disabled]="busy()"
          class="btn btn-secondary"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="busy()"
          class="btn btn-primary disabled:cursor-wait"
        >
          @if (busy()) {
            <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4Z"></path>
            </svg>
          }
          Empezar
        </button>
      </div>
    </form>
  </div>
}
