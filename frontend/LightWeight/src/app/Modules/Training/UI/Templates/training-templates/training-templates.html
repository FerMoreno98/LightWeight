<div class="min-h-screen px-4 py-10">
  <div class="mx-auto max-w-3xl">

    <div class="fade-slide-in">
      <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-white">Plantillas de entrenamiento</h1>
      </div>

      @if (error()) {
        <div class="mb-4 rounded-lg bg-red-950/50 border border-red-900 p-3 text-sm text-red-400">{{ error() }}</div>
      }

      @if (isLoading()) {
        <p class="text-sm text-slate-400">Cargando plantillas...</p>
      } @else if (templates().length === 0) {
        <p class="text-sm text-slate-400">No hay plantillas todavía.</p>
      } @else {
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          @for (template of templates(); track template.id) {
            <button
              type="button"
              (click)="goToSessions(template)"
              class="rounded-2xl border border-slate-700 bg-slate-800 p-5 text-left shadow-lg transition duration-200 hover:-translate-y-0.5 hover:border-emerald-400 hover:shadow-emerald-500/10 focus:outline-none focus:ring-2 focus:ring-emerald-400/40"
            >
              <h2 class="text-lg font-semibold text-white">{{ template.name }}</h2>

              <div class="mt-2 flex flex-wrap gap-1.5 text-xs text-slate-300">
                <span class="rounded-full border border-slate-700 bg-slate-900 px-2.5 py-1">
                  {{ volumeLandmarkLabel(template) }}
                </span>
                <span class="rounded-full border border-slate-700 bg-slate-900 px-2.5 py-1">
                  {{ trainingDistributionLabel(template) }}
                </span>
              </div>

              <div class="mt-2 flex flex-wrap gap-1.5">
                @for (entry of totalVolumeEntries(template); track entry[0]) {
                  <span class="rounded-full border border-slate-700 bg-slate-900 px-2.5 py-1 text-xs text-slate-300">
                    {{ entry[0] }}: {{ entry[1] }}
                  </span>
                } @empty {
                  <span class="text-xs text-slate-500">Sin series</span>
                }
              </div>
            </button>
          }
        </div>
      }
    </div>

  </div>
</div>
