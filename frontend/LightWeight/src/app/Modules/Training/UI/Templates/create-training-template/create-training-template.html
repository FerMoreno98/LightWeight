<div class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm rounded-xl bg-surface border border-line p-8 shadow-xl">
    <h1 class="font-display uppercase leading-none mb-6 text-center text-3xl font-bold text-fg">Nueva plantilla de entrenamiento</h1>

    @if (error()) {
      <div class="mb-4 rounded-lg bg-danger/10 border border-danger/30 p-3 text-sm text-danger">{{ error() }}</div>
    }

    @if (!isLoading() && programs().length === 0) {
      <div class="flex flex-col items-center gap-3 text-center">
        <p class="text-sm text-soft">Las plantillas pertenecen a un programa y todavía no tienes ninguno.</p>
        <a
          [routerLink]="createProgramLink"
          class="btn btn-primary"
        >
          Crear programa
        </a>
      </div>
    } @else {
      <form #templateForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <div class="flex items-center justify-between">
            <label for="programId" class="block text-sm font-medium text-soft">Programa</label>
            <a [routerLink]="createProgramLink" class="text-xs font-medium text-accent transition hover:text-accent">+ Nuevo programa</a>
          </div>
          <select
            id="programId"
            [(ngModel)]="programId"
            name="programId"
            required
            class="input mt-1"
          >
            <option value="" disabled>Selecciona un programa</option>
            @for (program of programs(); track program.id) {
              <option [value]="program.id">{{ program.name }}</option>
            }
          </select>
        </div>

        <div>
          <label for="name" class="block text-sm font-medium text-soft">Nombre</label>
          <input
            id="name"
            type="text"
            [(ngModel)]="name"
            name="name"
            required
            maxlength="200"
            placeholder="Ej: Hipertrofia base, Deload..."
            class="input mt-1"
          />
        </div>

        <div>
          <label for="volumeLandmark" class="block text-sm font-medium text-soft">Volume landmark</label>
          <select
            id="volumeLandmark"
            [(ngModel)]="volumeLandmark"
            name="volumeLandmark"
            required
            class="input mt-1"
          >
            <option value="" disabled selected>Selecciona un volume landmark</option>
            <option value="MV">MV — Maintenance Volume</option>
            <option value="MEV">MEV — Minimum Effective Volume</option>
            <option value="MAV">MAV — Maximum Adaptive Volume</option>
            <option value="MRV">MRV — Maximum Recoverable Volume</option>
          </select>
        </div>

        <div>
          <label for="trainingDistribution" class="block text-sm font-medium text-soft">Distribución del entrenamiento</label>
          <select
            id="trainingDistribution"
            [(ngModel)]="trainingDistribution"
            name="trainingDistribution"
            required
            class="input mt-1"
          >
            <option value="" disabled selected>Selecciona una distribución</option>
            <option value="PushPullLegs">Push Pull Legs</option>
            <option value="UpperLower">Upper Lower</option>
            <option value="Weider">Weider</option>
            <option value="Phat">Phat</option>
            <option value="FullBody">Full Body</option>
            <option value="Other">Otra</option>
          </select>
        </div>

        <div>
          <label for="durationInDays" class="block text-sm font-medium text-soft">Duración (días)</label>
          <input
            id="durationInDays"
            type="number"
            [(ngModel)]="durationInDays"
            name="durationInDays"
            required
            min="1"
            class="input mt-1"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading() || templateForm.invalid || !name.trim() || !durationInDays || durationInDays < 1"
          class="btn btn-primary w-full"
        >
          {{ isLoading() ? 'Creando...' : 'Crear plantilla' }}
        </button>
      </form>
    }
  </div>
</div>
