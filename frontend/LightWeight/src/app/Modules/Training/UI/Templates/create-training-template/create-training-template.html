<div class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm rounded-2xl bg-slate-800 border border-slate-700 p-8 shadow-xl">
    <h1 class="mb-6 text-center text-2xl font-bold text-white">Nueva plantilla de entrenamiento</h1>

    @if (error()) {
      <div class="mb-4 rounded-lg bg-red-950/50 border border-red-900 p-3 text-sm text-red-400">{{ error() }}</div>
    }

    <form
      #templateForm="ngForm"
      (ngSubmit)="onSubmit({ name: name, volumeLandmark: volumeLandmark, trainingDistribution: trainingDistribution })"
      class="space-y-4"
    >
      <div>
        <label for="name" class="block text-sm font-medium text-slate-300">Nombre</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          placeholder="Nombre de la plantilla"
          class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20"
        />
      </div>

      <div>
        <label for="volumeLandmark" class="block text-sm font-medium text-slate-300">Volume landmark</label>
        <select
          id="volumeLandmark"
          [(ngModel)]="volumeLandmark"
          name="volumeLandmark"
          required
          class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20"
        >
          <option value="" disabled selected>Selecciona un volume landmark</option>
          <option value="MV">MV — Maintenance Volume</option>
          <option value="MEV">MEV — Minimum Effective Volume</option>
          <option value="MAV">MAV — Maximum Adaptive Volume</option>
          <option value="MRV">MRV — Maximum Recoverable Volume</option>
        </select>
      </div>

      <div>
        <label for="trainingDistribution" class="block text-sm font-medium text-slate-300">Distribución del entrenamiento</label>
        <select
          id="trainingDistribution"
          [(ngModel)]="trainingDistribution"
          name="trainingDistribution"
          required
          class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2 text-sm text-white outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20"
        >
          <option value="" disabled selected>Selecciona una distribución</option>
          <option value="PushPullLegs">Push Pull Legs</option>
          <option value="UpperLower">Upper Lower</option>
          <option value="Weider">Weider</option>
          <option value="Phat">Phat</option>
          <option value="FullBody">Full Body</option>
          <option value="Other">Otra</option>
        </select>
      </div>

      <button
        type="submit"
        [disabled]="isLoading() || templateForm.invalid"
        class="w-full rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-900 transition hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isLoading() ? 'Creando...' : 'Crear plantilla' }}
      </button>
    </form>
  </div>
</div>
