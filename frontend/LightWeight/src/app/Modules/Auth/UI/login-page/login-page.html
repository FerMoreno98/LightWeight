<div class="flex min-h-screen items-center justify-center px-4">
  <div class="card w-full max-w-sm p-8 shadow-lg shadow-black/30">
    <h1 class="font-display uppercase leading-none mb-6 text-center text-4xl font-bold text-fg">Iniciar sesión</h1>

    @if (error()) {
      <div class="mb-4 alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-fg">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="tu@email.com"
          class="input mt-1"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="btn btn-primary w-full"
      >
        {{ isLoading() ? 'Enviando...' : 'Enviar código' }}
      </button>
    </form>
  </div>
</div>
