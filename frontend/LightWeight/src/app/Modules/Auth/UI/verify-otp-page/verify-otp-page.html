<div class="flex min-h-screen items-center justify-center px-4">
  <div class="card w-full max-w-sm p-8 shadow-lg shadow-black/30">
    <h1 class="font-display uppercase leading-none mb-2 text-center text-4xl font-bold text-fg">Verificar código</h1>
    <p class="mb-6 text-center text-sm text-muted">Te enviamos un código a <span class="font-medium text-fg">{{ email }}</span></p>

    @if (error()) {
      <div class="mb-4 alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="code" class="block text-sm font-medium text-fg">Código</label>
        <input
          id="code"
          type="text"
          [(ngModel)]="code"
          name="code"
          required
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="123456"
          class="input mt-1 text-center font-display text-2xl! font-semibold tracking-[0.5em]"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="btn btn-primary w-full"
      >
        {{ isLoading() ? 'Verificando...' : 'Verificar código' }}
      </button>
    </form>
  </div>
</div>
