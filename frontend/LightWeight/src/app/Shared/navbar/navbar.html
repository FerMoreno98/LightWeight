

  <!-- Boton hamburguesa (movil) -->
  <button (click)="openMenu()"
          class="fixed top-4 left-4 z-50 flex items-center justify-center w-11 h-11 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 md:hidden"
          aria-label="Abrir menu">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <!-- Overlay que tapa el fondo al abrir el menu -->
  <div (click)="closeMenu()"
       [class.hidden]="!menuOpen"
       class="fixed inset-0 bg-black/60 z-40 md:hidden"></div>

  <!-- Menu lateral deslizable -->
  <nav [class.-translate-x-full]="!menuOpen"
       class="fixed top-0 left-0 h-full w-72 bg-slate-800 border-r border-slate-700 z-50 transform transition-transform duration-300 md:hidden flex flex-col pt-16 px-4 gap-1">
    <a href="#" class="px-3 py-2 rounded-lg hover:bg-slate-700 transition">Inicio</a>

    <!-- Entrenamiento con subopciones -->
    <div>
      <button (click)="toggleTrainingMenu()"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-700 transition">
        <span>Entrenamiento</span>
        <svg [class.rotate-180]="trainingMenuOpen"
             class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>
      <div [class.hidden]="!trainingMenuOpen"
           class="ml-3 border-l border-slate-700 pl-3 mt-1 flex flex-col gap-1">
        <a href="#" class="px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">Crear plantilla</a>
        <a href="#" class="px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">Modificar plantilla</a>
        <a href="#" class="px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">Mesociclos</a>
        <a href="/training/macrocycle" class="px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">Macrociclos</a>
        <a href="#" class="px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 transition">Microciclos</a>
      </div>
    </div>
  </nav>

  <!-- Barra superior (escritorio) -->
  <header class="hidden md:flex items-center justify-between px-8 py-4 border-b border-slate-800">
    <a href="#" class="text-xl font-bold">LightWeight</a>
    <div class="flex items-center gap-6 relative">
      <a href="#" class="text-slate-300 hover:text-white transition">Inicio</a>
      <div class="relative">
        <button (click)="toggleDesktopMenu()" class="flex items-center gap-1 text-slate-300 hover:text-white transition">
          Entrenamiento
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div [class.hidden]="!desktopMenuOpen"
             class="absolute right-0 mt-2 w-56 rounded-lg bg-slate-800 border border-slate-700 shadow-lg py-1 z-40">
          <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition">Crear plantilla</a>
          <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition">Modificar plantilla</a>
          <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition">Mesociclos</a>
          <a href="/training/macrocycle" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition">Macrociclos</a>
          <a href="#" class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition">Microciclos</a>
        </div>
      </div>
    </div>
  </header>
