@if (visible()) {
  <!-- Top bar: brand on mobile, brand + sections on desktop -->
  <header class="sticky top-0 z-40 border-b border-line bg-canvas/90 backdrop-blur">
    <div class="mx-auto flex h-14 max-w-5xl items-center justify-between px-4 md:h-16">
      <a routerLink="/home" class="font-display text-2xl font-bold uppercase tracking-wide">LightWeight</a>

      <div class="flex items-center gap-1">
        <nav class="hidden items-center gap-1 md:flex" aria-label="Navegación principal">
          @for (section of sections; track section.key) {
            <a
              [routerLink]="section.link"
              [attr.aria-current]="currentSection() === section.key ? 'page' : null"
              class="relative rounded-lg px-3 py-2 text-sm font-semibold transition-colors"
              [class]="currentSection() === section.key ? 'text-fg bg-raised' : 'text-muted hover:text-fg hover:bg-raised'"
            >
              {{ section.label }}
            </a>
          }
        </nav>

        <!-- Profile: top right on mobile and desktop, out of the tab bar -->
        <a
          routerLink="/profile"
          aria-label="Tu perfil"
          title="Tu perfil"
          [attr.aria-current]="currentSection() === 'profile' ? 'page' : null"
          class="btn-icon"
          [class]="currentSection() === 'profile' ? 'text-accent bg-raised' : 'text-muted hover:text-fg hover:bg-raised'"
        >
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="profileIcon" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Bottom tab bar (mobile) -->
  <nav
    class="fixed inset-x-0 bottom-0 z-40 grid grid-cols-4 border-t border-line bg-surface pb-[env(safe-area-inset-bottom)] md:hidden"
    aria-label="Navegación principal"
  >
    @for (section of sections; track section.key) {
      <a
        [routerLink]="section.link"
        [attr.aria-current]="currentSection() === section.key ? 'page' : null"
        class="relative flex min-h-16 flex-col items-center justify-center gap-1 text-xs font-semibold transition-colors"
        [class]="currentSection() === section.key ? 'text-accent' : 'text-subtle hover:text-fg'"
      >
        @if (currentSection() === section.key) {
          <span class="absolute top-0 h-0.5 w-8 rounded-b-full bg-accent" aria-hidden="true"></span>
        }
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="section.icon" />
        </svg>
        {{ section.label }}
      </a>
    }
  </nav>
}
